services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MRA_DB_DATABASE:-db_mra}
      MYSQL_USER: ${MRA_DB_USER:-mra_user}
      MYSQL_PASSWORD: ${MRA_DB_PASSWORD:?Set MRA_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mra_mysql_data:/var/lib/mysql
      - ./database/db_mra_prod_202610091047.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HIS_DB_HOST: ${HIS_DB_HOST:-127.0.0.1}
      HIS_DB_PORT: ${HIS_DB_PORT:-3306}
      HIS_DB_DATABASE: ${HIS_DB_DATABASE:-hos}
      HIS_DB_USER: ${HIS_DB_USER:-}
      HIS_DB_PASSWORD: ${HIS_DB_PASSWORD:-}
      MRA_DB_HOST: db
      MRA_DB_PORT: 3306
      MRA_DB_DATABASE: ${MRA_DB_DATABASE:-db_mra}
      MRA_DB_USER: ${MRA_DB_USER:-mra_user}
      MRA_DB_PASSWORD: ${MRA_DB_PASSWORD:?Set MRA_DB_PASSWORD in .env}
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:?Set ADMIN_SETUP_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
    ports:
      - "3000:3000"

volumes:
  mra_mysql_data:
